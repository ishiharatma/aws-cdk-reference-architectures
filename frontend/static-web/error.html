<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一時的にアクセスできません | Northlight Cloud</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="error-page">
    <div class="error-card">
      <svg class="error-icon" width="56" height="56" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="10" stroke="#FF9900" stroke-width="1.8"/>
        <path d="M12 8v5" stroke="#FF9900" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="16" r="1" fill="#FF9900"/>
      </svg>
      <h1>一時的にアクセスできません</h1>
      <p>サーバーで問題が発生しました。しばらく時間をおいてから、もう一度お試しください。</p>
      <a class="btn btn-primary" href="/">トップページへ戻る</a>
    </div>
  </div>
</body>
</html>
