name: Deploy GitHub Pages (frontend)

on:
  push:
    branches: ["main"]
    # pages/ に変更があったときだけデプロイ（スキップ要件）
    paths:
      - "pages/**"
      - "infrastructure/workspaces/**/overview.drawio.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v6

      # raw.githubusercontent.com への直リンクは匿名アクセスのレート制限(429)を受けやすいため、
      # 各ワークスペースの構成図SVGを pages/ 配下にコピーして同一オリジン配信にする
      - name: Copy pattern overview images into pages/
        run: |
          set -eu
          for svg in infrastructure/workspaces/*/overview.drawio.svg; do
            [ -e "$svg" ] || continue
            pattern_dir=$(basename "$(dirname "$svg")")
            mkdir -p "pages/${pattern_dir}"
            cp "$svg" "pages/${pattern_dir}/overview.drawio.svg"
          done

      # pages/ をそのまま Pages の公開物としてアップロード
      # https://github.com/actions/upload-pages-artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages
      # https://github.com/actions/deploy-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
