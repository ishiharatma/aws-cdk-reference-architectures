version: 0.2

# Build stage: docker build → Trivy スキャン(HIGH/CRITICAL でビルド失敗、ECR への push を止める) → ECR push。
# CodeBuild プロジェクト側で以下の環境変数が注入される想定:
#   PROJECT, ENV, ECR_REPO_URI

phases:
  pre_build:
    commands:
      - echo "=== [Build] project=${PROJECT} env=${ENV} ==="
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${ECR_REPO_URI}
      - COMMIT_HASH=$(echo ${CODEBUILD_RESOLVED_SOURCE_VERSION} | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}
      - cd backend/ecspresso-bedrock-review-app
  build:
    commands:
      - echo "Building the Docker image..."
      - docker build -t ${ECR_REPO_URI}:${IMAGE_TAG} -t ${ECR_REPO_URI}:latest .
      - echo "Scanning image with Trivy (HIGH/CRITICAL findings fail the build, blocking the push to ECR)..."
      - |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          -v trivy-cache:/root/.cache/ \
          aquasec/trivy image --exit-code 1 --severity HIGH,CRITICAL --no-progress \
          ${ECR_REPO_URI}:${IMAGE_TAG}
  post_build:
    commands:
      - echo "Pushing the Docker images..."
      - docker push ${ECR_REPO_URI}:${IMAGE_TAG}
      - docker push ${ECR_REPO_URI}:latest
      - echo "Writing image tag file for the Deploy stage..."
      - echo -n "${IMAGE_TAG}" > image-tag.txt
      - printf '[{"name":"%s","imageUri":"%s"}]' "${PROJECT}-${ENV}-api" "${ECR_REPO_URI}:${IMAGE_TAG}" > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  base-directory: backend/ecspresso-bedrock-review-app
  files:
    - image-tag.txt
    - imagedefinitions.json
  name: BuildArtifact
