version: 0.2

# Deploy stage: updates the ECS Fargate service with ecspresso (+ jsonnet).
#
# IMPORTANT: This sample has no real ECS cluster/service, so it never runs
# `ecspresso verify` / `ecspresso deploy` (both call AWS APIs). It only runs
# `ecspresso render`, a purely local command, to confirm the jsonnet
# definitions render correctly. In an environment with a real cluster,
# uncomment the "actual deploy steps" lines below.
#
# Expected environment variables (injected by the CodeBuild project):
#   PROJECT, ENV, ECR_REPO_URI, TASK_CPU, TASK_MEMORY, DESIRED_COUNT, ENABLE_ECS_EXEC,
#   AUTO_SCALING_ENABLED
#
# [When deploying to a service that already has Application Auto Scaling configured]
# Pass AUTO_SCALING_ENABLED=true. ecs-service-def.jsonnet then omits the
# desiredCount field entirely, so ecspresso deploy no longer changes
# UpdateService's DesiredCount (whatever count Auto Scaling has set is left
# untouched). Leaving this false (the default) means desiredCount is reset
# to the fixed DESIRED_COUNT value (default 1 in this sample) on every
# deploy -- see the comment at the top of ecs-service-def.jsonnet for details.
#
# SSM Parameter Store parameter names read here (default paths, created on the CDK side):
#   /${PROJECT}/${ENV}/ecs/cluster-name
#   /${PROJECT}/${ENV}/ecs/service-name
#   /${PROJECT}/${ENV}/ecs/execution-role-arn
#   /${PROJECT}/${ENV}/ecs/task-role-arn
#   /${PROJECT}/${ENV}/ecs/subnet-ids            (comma-separated)
#   /${PROJECT}/${ENV}/ecs/security-group-ids    (comma-separated)
#   /${PROJECT}/${ENV}/ecs/target-group-arn      (empty string if unused)

phases:
  install:
    commands:
      - echo "Installing ecspresso..."
      - |
        curl -sL "https://github.com/kayac/ecspresso/releases/latest/download/ecspresso_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz" \
          -o /tmp/ecspresso.tar.gz
      - tar xzf /tmp/ecspresso.tar.gz -C /usr/local/bin ecspresso
      - chmod +x /usr/local/bin/ecspresso
      - ecspresso version

  pre_build:
    commands:
      - echo "=== [Deploy] project=${PROJECT} env=${ENV} ==="
      - echo "Resolving ECS cluster/service names and IAM roles via SSM Parameter Store..."
      - export ECS_CLUSTER_NAME=$(aws ssm get-parameter --name "/${PROJECT}/${ENV}/ecs/cluster-name" --query 'Parameter.Value' --output text)
      - export ECS_SERVICE_NAME=$(aws ssm get-parameter --name "/${PROJECT}/${ENV}/ecs/service-name" --query 'Parameter.Value' --output text)
      - export EXECUTION_ROLE_ARN=$(aws ssm get-parameter --name "/${PROJECT}/${ENV}/ecs/execution-role-arn" --query 'Parameter.Value' --output text)
      - export TASK_ROLE_ARN=$(aws ssm get-parameter --name "/${PROJECT}/${ENV}/ecs/task-role-arn" --query 'Parameter.Value' --output text)
      - export SUBNET_IDS=$(aws ssm get-parameter --name "/${PROJECT}/${ENV}/ecs/subnet-ids" --query 'Parameter.Value' --output text)
      - export SECURITY_GROUP_IDS=$(aws ssm get-parameter --name "/${PROJECT}/${ENV}/ecs/security-group-ids" --query 'Parameter.Value' --output text)
      - export TARGET_GROUP_ARN=$(aws ssm get-parameter --name "/${PROJECT}/${ENV}/ecs/target-group-arn" --query 'Parameter.Value' --output text 2>/dev/null || echo "")
      # image-tag.txt / imagedefinitions.json live in the Build stage's BuildArtifact (secondary source)
      - export IMAGE_TAG=$(cat "${CODEBUILD_SRC_DIR_BuildArtifact}/image-tag.txt" 2>/dev/null || echo "latest")
      - echo "cluster=${ECS_CLUSTER_NAME} service=${ECS_SERVICE_NAME} image_tag=${IMAGE_TAG}"
      - cd backend/ecspresso-bedrock-review-app/ecspresso

  build:
    commands:
      - echo "AUTO_SCALING_ENABLED=${AUTO_SCALING_ENABLED:-false} (when true, desiredCount is omitted from the service definition)"
      - echo "Rendering ecspresso jsonnet definitions (no AWS API calls)..."
      - ecspresso render config --config ecspresso.jsonnet
      - ecspresso render task-def --config ecspresso.jsonnet
      - ecspresso render service-def --config ecspresso.jsonnet
      - |
        echo "=========================================================="
        echo " This sample has no real ECS cluster/service, so"
        echo " 'ecspresso verify' / 'ecspresso deploy' were skipped."
        echo " Actual deploy steps (for an environment with a real cluster):"
        echo "   ecspresso verify --config ecspresso.jsonnet"
        echo "   ecspresso deploy --config ecspresso.jsonnet"
        echo "=========================================================="
      # --- Actual deploy steps (uncomment in an environment with a real cluster) ---
      # - ecspresso verify --config ecspresso.jsonnet
      # - ecspresso deploy --config ecspresso.jsonnet

  post_build:
    commands:
      - echo "Deploy stage complete."
