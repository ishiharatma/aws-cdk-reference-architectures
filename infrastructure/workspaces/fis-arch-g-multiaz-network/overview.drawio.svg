<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     version="1.1" width="1180" height="660" viewBox="0 0 1180 660">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555555"/>
    </marker>
    <marker id="arr_red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc0000"/>
    </marker>
  </defs>
  <rect width="1180" height="660" fill="#fafafa"/>
  <text x="590" y="24" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">Architecture G: Multi-AZ Network Disruption — NLB + EC2 Auto Scaling Group + Aurora PostgreSQL</text>

  <!-- Internet -->
  <rect x="20" y="110" width="100" height="60" rx="8" fill="#e8eaf6" stroke="#283593" stroke-width="1.5"/>
  <text x="70" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">Internet</text>

  <!-- NLB -->
  <rect x="150" y="90" width="190" height="100" rx="8" fill="#e1f5fe" stroke="#0277bd" stroke-width="1.5"/>
  <text x="245" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">Network Load Balancer</text>
  <text x="245" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555555">internet-facing · 2 AZs</text>
  <text x="245" y="166" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555555">cross-zone load balancing</text>

  <!-- Stop-condition alarm -->
  <rect x="150" y="205" width="190" height="55" rx="8" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="245" y="227" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">CloudWatch Alarm</text>
  <text x="245" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555555">NLB UnHealthyHostCount ≥ 2</text>

  <!-- Internet -> NLB -->
  <line x1="120" y1="140" x2="150" y2="140" stroke="#555555" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- VPC -->
  <rect x="375" y="60" width="785" height="480" rx="12" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="385" y="78" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#9e9e9e">VPC  10.70.0.0/16 — 2 Availability Zones</text>

  <!-- AZ-1 column (FIS target) -->
  <rect x="390" y="90" width="370" height="430" rx="12" fill="none" stroke="#c62828" stroke-width="1.8" stroke-dasharray="6,3"/>
  <text x="400" y="108" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c62828">Availability Zone 1 (ap-northeast-1a) — FIS G-1 / G-2 target</text>

  <rect x="405" y="130" width="340" height="55" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="415" y="147" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1565c0">Public Subnet /24</text>
  <rect x="610" y="145" width="110" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="665" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1a1a1a">NAT Gateway</text>

  <rect x="405" y="200" width="340" height="140" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="415" y="217" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#2e7d32">Private Subnet /24 (FIS G-1/G-2 target)</text>
  <rect x="430" y="235" width="280" height="90" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="570" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">EC2 (t3.small) × 1–2</text>
  <text x="570" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555555">nginx · fis-target=app-instance</text>
  <text x="570" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555555">AL2023 · IMDSv2</text>

  <rect x="405" y="355" width="340" height="140" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="415" y="372" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#c62828">Isolated Subnet /24</text>
  <rect x="430" y="390" width="280" height="90" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="570" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">Aurora Writer</text>
  <text x="570" y="443" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555555">PostgreSQL 16 · sv2 0.5–4 ACU</text>

  <!-- AZ-2 column -->
  <rect x="775" y="90" width="370" height="430" rx="12" fill="none" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="785" y="108" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#616161">Availability Zone 2 (ap-northeast-1c)</text>

  <rect x="790" y="130" width="340" height="55" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="800" y="147" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1565c0">Public Subnet /24</text>
  <text x="800" y="163" font-family="Arial,sans-serif" font-size="9" fill="#777777">no NAT here — egress routes via AZ-1</text>

  <rect x="790" y="200" width="340" height="140" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="800" y="217" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#2e7d32">Private Subnet /24</text>
  <rect x="815" y="235" width="280" height="90" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="955" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">EC2 (t3.small) × 1–2</text>
  <text x="955" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555555">nginx · fis-target=app-instance</text>
  <text x="955" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555555">AL2023 · IMDSv2</text>

  <rect x="790" y="355" width="340" height="140" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="800" y="372" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#c62828">Isolated Subnet /24</text>
  <rect x="815" y="390" width="280" height="90" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="955" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">Aurora Reader</text>
  <text x="955" y="443" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555555">PostgreSQL 16 · sv2 0.5–4 ACU</text>

  <!-- Aurora replication -->
  <line x1="710" y1="435" x2="815" y2="435" stroke="#1565c0" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="762" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#1565c0">sync replication</text>

  <!-- NLB -> AZ-1 private subnet -->
  <polyline points="200,190 200,270 405,270" fill="none" stroke="#555555" stroke-width="1.8" marker-end="url(#arr)"/>
  <!-- NLB -> AZ-2 private subnet (routed above the VPC to avoid crossing AZ-1) -->
  <polyline points="340,110 340,45 960,45 960,200" fill="none" stroke="#555555" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- FIS Experiments panel -->
  <rect x="20" y="290" width="330" height="350" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="30" y="308" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c62828">AWS FIS Experiments</text>

  <rect x="30" y="325" width="310" height="58" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
  <text x="40" y="345" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c62828">G-1: AZ-1 Cross-AZ Traffic Disruption (5 min)</text>
  <text x="40" y="362" font-family="Arial,sans-serif" font-size="9" fill="#666">aws:network:disrupt-connectivity (scope=availability-zone)</text>

  <rect x="30" y="393" width="310" height="58" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
  <text x="40" y="413" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c62828">G-2: AZ-1 Total Isolation (5 min)</text>
  <text x="40" y="430" font-family="Arial,sans-serif" font-size="9" fill="#666">aws:network:disrupt-connectivity (scope=all)</text>

  <rect x="30" y="461" width="310" height="58" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
  <text x="40" y="481" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c62828">G-3: Aurora Multi-AZ Failover</text>
  <text x="40" y="498" font-family="Arial,sans-serif" font-size="9" fill="#666">aws:rds:failover-db-cluster</text>

  <rect x="30" y="529" width="310" height="58" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
  <text x="40" y="549" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c62828">G-4: AZ-scoped EC2 Termination (~50%)</text>
  <text x="40" y="566" font-family="Arial,sans-serif" font-size="9" fill="#666">aws:ec2:terminate-instances</text>

  <rect x="30" y="597" width="310" height="24" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="40" y="613" font-family="Arial,sans-serif" font-size="10" fill="#e65100">Stop: NLB UnHealthyHostCount ≥ 2 → auto-stops experiment</text>

  <!-- FIS -> AZ-1 subnet (G-1/G-2/G-4) -->
  <polyline points="175,290 175,270 405,270" fill="none" stroke="#cc0000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr_red)"/>
  <!-- FIS -> Aurora writer (G-3) -->
  <polyline points="175,290 175,275 380,275 380,435 430,435" fill="none" stroke="#cc0000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr_red)"/>
</svg>
