version: 0.2
# infra CI buildspec
# InfraPipelineConstruct から参照される prs-infra リポジトリ用 CI 定義。
# Source: prs-infra（ブランチはenv に応じて切り替え）
# Stage: Test（lint / cdk synth / npm test）
#
# 環境変数（CodeBuild 側で設定済み）:
#   PROJECT: prs
#   ENV: dev | stage | prod
#   CDK_PROFILE: "" （空 = CodeBuild インスタンスロールを使用）

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo Project [${PROJECT}]
      - echo Environment [${ENV}]
      - cd infra
      - npm ci

  pre_build:
    commands:
      # lint チェック
      - npm run lint
      # cdk synth: CDK_PROFILE が空の場合は --profile を渡さず CodeBuild インスタンスロールを使用する
      - |
        PROFILE_OPT=""
        if [ -n "$CDK_PROFILE" ]; then
          PROFILE_OPT="--profile $CDK_PROFILE"
        fi
        COMMIT_HASH=$(git rev-parse --short HEAD) \
          npx cdk synth --version-reporting false --asset-metadata false \
          $PROFILE_OPT

  build:
    commands:
      # ユニット / バリデーション / スナップショット / コンプライアンステストを一括実行
      - npm test
