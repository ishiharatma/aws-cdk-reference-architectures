<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="620" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#111">Serverless Codex App Server on AWS Lambda MicroVMs</text>

  <!-- Client -->
  <rect x="20" y="70" width="150" height="60" rx="6" fill="#f2f2f2" stroke="#666"/>
  <text x="95" y="105" font-size="13" text-anchor="middle" fill="#111">Client (IDE / CLI)</text>

  <!-- Control plane box -->
  <rect x="230" y="55" width="420" height="230" rx="8" fill="#eef4fb" stroke="#2b6cb0"/>
  <text x="245" y="75" font-size="13" font-weight="bold" fill="#2b6cb0">Control plane</text>

  <rect x="250" y="90" width="180" height="45" rx="5" fill="#ffffff" stroke="#2b6cb0"/>
  <text x="340" y="117" font-size="12" text-anchor="middle" fill="#111">API Gateway HTTP API</text>

  <rect x="450" y="90" width="180" height="45" rx="5" fill="#ffffff" stroke="#2b6cb0"/>
  <text x="540" y="110" font-size="11" text-anchor="middle" fill="#111">Cognito User Pool</text>
  <text x="540" y="124" font-size="10" text-anchor="middle" fill="#555">JWT Authorizer</text>

  <rect x="250" y="150" width="380" height="110" rx="5" fill="#ffffff" stroke="#2b6cb0"/>
  <text x="440" y="168" font-size="12" text-anchor="middle" fill="#111">5 session-lifecycle Lambda functions</text>
  <text x="440" y="186" font-size="10" text-anchor="middle" fill="#555">create / get / delete / suspend / resume</text>
  <text x="440" y="202" font-size="10" text-anchor="middle" fill="#555">RunMicrovm・GetMicrovm・SuspendMicrovm・</text>
  <text x="440" y="216" font-size="10" text-anchor="middle" fill="#555">ResumeMicrovm・TerminateMicrovm・CreateMicrovmAuthToken</text>
  <rect x="270" y="228" width="150" height="26" rx="4" fill="#f7fafc" stroke="#a0aec0"/>
  <text x="345" y="245" font-size="10" text-anchor="middle" fill="#333">DynamoDB SessionsTable</text>
  <rect x="440" y="228" width="170" height="26" rx="4" fill="#f7fafc" stroke="#a0aec0"/>
  <text x="525" y="245" font-size="10" text-anchor="middle" fill="#333">Secrets Manager (OpenAI key)</text>

  <!-- Data plane box -->
  <rect x="700" y="55" width="260" height="380" rx="8" fill="#fdf3e7" stroke="#c05621"/>
  <text x="715" y="75" font-size="13" font-weight="bold" fill="#c05621">Data plane (per session)</text>

  <rect x="715" y="95" width="230" height="70" rx="5" fill="#ffffff" stroke="#c05621"/>
  <text x="830" y="118" font-size="12" text-anchor="middle" fill="#111">AWS::Lambda::MicrovmImage</text>
  <text x="830" y="134" font-size="10" text-anchor="middle" fill="#555">Dockerfile + 6 lifecycle hooks</text>
  <text x="830" y="150" font-size="10" text-anchor="middle" fill="#555">(run/ready/suspend/resume/terminate/validate)</text>

  <rect x="715" y="180" width="230" height="120" rx="5" fill="#fff7ed" stroke="#c05621"/>
  <text x="830" y="200" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">MicroVM (Firecracker)</text>
  <text x="830" y="218" font-size="10" text-anchor="middle" fill="#555">VM-isolated, dedicated HTTPS endpoint</text>
  <text x="830" y="234" font-size="10" text-anchor="middle" fill="#555">codex app-server</text>
  <text x="830" y="248" font-size="10" text-anchor="middle" fill="#555">WebSocket JSON-RPC</text>
  <text x="830" y="262" font-size="10" text-anchor="middle" fill="#555">Thread / Turn / Item</text>
  <text x="830" y="280" font-size="10" text-anchor="middle" fill="#777">RUNNING ⇄ SUSPENDED (idlePolicy)</text>

  <rect x="715" y="315" width="230" height="45" rx="5" fill="#ffffff" stroke="#c05621"/>
  <text x="830" y="335" font-size="11" text-anchor="middle" fill="#111">AWS::Lambda::NetworkConnector</text>
  <text x="830" y="350" font-size="10" text-anchor="middle" fill="#555">VPC egress (1x NAT Gateway)</text>

  <rect x="715" y="375" width="230" height="45" rx="5" fill="#f2f2f2" stroke="#666"/>
  <text x="830" y="402" font-size="11" text-anchor="middle" fill="#111">OpenAI API</text>

  <!-- Arrows -->
  <path d="M170,100 L250,112" stroke="#444" fill="none" marker-end="url(#arrow)"/>
  <text x="180" y="95" font-size="10" fill="#444">1. POST /sessions (JWT)</text>

  <path d="M440,260 L440,340 L700,215" stroke="#444" fill="none" marker-end="url(#arrow)"/>
  <text x="450" y="300" font-size="10" fill="#444">RunMicrovm / GetMicrovm / ...</text>

  <path d="M830,300 L830,315" stroke="#444" fill="none" marker-end="url(#arrow)"/>
  <path d="M830,360 L830,375" stroke="#444" fill="none" marker-end="url(#arrow)"/>

  <path d="M700,240 Q460,470 95,150" stroke="#c05621" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="470" font-size="10" fill="#c05621">2. WebSocket + X-aws-proxy-auth, direct to MicroVM endpoint</text>

  <text x="20" y="480" font-size="10" fill="#777">Control plane brokers session lifecycle only; it never proxies codex app-server (Thread/Turn/Item) traffic.</text>
  <text x="20" y="498" font-size="10" fill="#777">See README.md / README.ja.md for the full component table and design rationale.</text>
</svg>
