<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     version="1.1" width="1220" height="900" viewBox="0 0 1220 900">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555555"/>
    </marker>
    <marker id="arr_green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
    <marker id="arr_orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e65100"/>
    </marker>
    <marker id="arr_red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
    </marker>
  </defs>
  <rect width="1220" height="900" fill="#fafafa"/>
  <text x="610" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">Architecture F: Step Functions Saga (order processing) + 5 Lambda functions + DynamoDB</text>

  <!-- ============ Step Functions container ============ -->
  <rect x="40" y="55" width="1140" height="470" rx="12" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="52" y="73" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#9e9e9e">AWS Step Functions — Standard workflow "order-saga"  (Logs: ALL · X-Ray tracing)</text>

  <!-- Column 1: ReserveInventory -->
  <rect x="70" y="95" width="200" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="170" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">ReserveInventory</text>
  <text x="170" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#555555">Retry: 2 attempts · 2s · x2 backoff</text>

  <rect x="70" y="220" width="200" height="60" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="170" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a1a1a">Fail</text>
  <text x="170" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#555555">no compensation needed</text>

  <!-- Column 2: ProcessPayment -->
  <rect x="340" y="95" width="200" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="440" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">ProcessPayment</text>
  <text x="440" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#555555">Retry: 2 attempts · 2s · x2 backoff</text>

  <rect x="340" y="220" width="200" height="60" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="440" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a1a1a">ReleaseInventory</text>
  <text x="440" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#555555">compensation</text>

  <rect x="340" y="330" width="200" height="60" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="440" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a1a1a">Fail</text>
  <text x="440" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#555555">inventory released</text>

  <!-- Column 3: ConfirmOrder -->
  <rect x="610" y="95" width="200" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="710" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">ConfirmOrder</text>
  <text x="710" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#555555">Retry: 2 attempts · 2s · x2 backoff</text>

  <rect x="610" y="220" width="200" height="60" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="710" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a1a1a">RefundPayment</text>
  <text x="710" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#555555">compensation 1 of 2</text>

  <rect x="610" y="330" width="200" height="60" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="710" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a1a1a">ReleaseInventory</text>
  <text x="710" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#555555">compensation 2 of 2</text>

  <rect x="610" y="440" width="200" height="60" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="710" y="465" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a1a1a">Fail</text>
  <text x="710" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#555555">payment refunded + inventory released</text>

  <!-- Column 4: Succeed -->
  <rect x="960" y="95" width="180" height="60" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1050" y="122" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">Succeed</text>
  <text x="1050" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#555555">OrderConfirmed</text>

  <!-- Forward-path arrows (success) -->
  <line x1="270" y1="125" x2="340" y2="125" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arr_green)"/>
  <line x1="540" y1="125" x2="610" y2="125" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arr_green)"/>
  <line x1="810" y1="125" x2="960" y2="125" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arr_green)"/>
  <text x="305" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#2e7d32">success</text>
  <text x="575" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#2e7d32">success</text>
  <text x="885" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#2e7d32">success</text>

  <!-- Catch arrows (down) -->
  <line x1="170" y1="155" x2="170" y2="220" stroke="#c62828" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr_red)"/>
  <text x="176" y="190" font-family="Arial,sans-serif" font-size="9" fill="#c62828">Catch (Retry exhausted)</text>

  <line x1="440" y1="155" x2="440" y2="220" stroke="#c62828" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr_red)"/>
  <text x="446" y="190" font-family="Arial,sans-serif" font-size="9" fill="#c62828">Catch</text>
  <line x1="440" y1="280" x2="440" y2="330" stroke="#e65100" stroke-width="1.6" marker-end="url(#arr_orange)"/>

  <line x1="710" y1="155" x2="710" y2="220" stroke="#c62828" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr_red)"/>
  <text x="716" y="190" font-family="Arial,sans-serif" font-size="9" fill="#c62828">Catch</text>
  <line x1="710" y1="280" x2="710" y2="330" stroke="#e65100" stroke-width="1.6" marker-end="url(#arr_orange)"/>
  <line x1="710" y1="390" x2="710" y2="440" stroke="#e65100" stroke-width="1.6" marker-end="url(#arr_orange)"/>

  <!-- ============ DynamoDB table ============ -->
  <rect x="460" y="555" width="300" height="60" rx="8" fill="#ede7f6" stroke="#4527a0" stroke-width="1.5"/>
  <text x="610" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">DynamoDB Orders Table</text>
  <text x="610" y="598" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#555555">PK: orderId · PAY_PER_REQUEST</text>
  <line x1="610" y1="525" x2="610" y2="555" stroke="#4527a0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="618" y="543" font-family="Arial,sans-serif" font-size="9" fill="#4527a0">all 5 Lambdas: UpdateItem #status</text>

  <!-- ============ FIS Experiments panel ============ -->
  <rect x="40" y="645" width="1140" height="235" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="52" y="663" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c62828">AWS FIS Experiments (FisStack) — target the forward-path Lambdas, not Step Functions</text>

  <rect x="70" y="678" width="220" height="70" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
  <text x="180" y="698" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c62828">F-2: ReserveInventory outage</text>
  <text x="180" y="715" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#666">aws:lambda:put-function-</text>
  <text x="180" y="729" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#666">concurrent-executions · 0 · 5min</text>

  <rect x="340" y="678" width="220" height="70" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
  <text x="450" y="698" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c62828">F-1: ProcessPayment outage</text>
  <text x="450" y="715" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#666">aws:lambda:put-function-</text>
  <text x="450" y="729" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#666">concurrent-executions · 0 · 5min</text>

  <rect x="610" y="678" width="220" height="70" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
  <text x="720" y="698" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c62828">F-3: ConfirmOrder outage</text>
  <text x="720" y="715" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#666">aws:lambda:put-function-</text>
  <text x="720" y="729" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#666">concurrent-executions · 0 · 5min</text>

  <rect x="880" y="678" width="270" height="70" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="1015" y="696" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#e65100">No aws:states:* FIS action exists</text>
  <text x="1015" y="712" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#8a4b00">so Saga Retry/Catch is exercised</text>
  <text x="1015" y="726" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#8a4b00">indirectly via its forward Lambdas</text>

  <rect x="70" y="810" width="1080" height="46" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.2"/>
  <text x="610" y="838" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#5c4a00">Shared stop condition — CloudWatch Alarm: StateMachine ExecutionsFailed ≥ 5 / 1 min → auto-stops F-1, F-2, and F-3</text>

  <!-- Dashed arrows from FIS action boxes up to the targeted forward Lambda task -->
  <polyline points="180,678 180,155 170,155" fill="none" stroke="#c62828" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr_red)"/>
  <polyline points="450,678 450,155 440,155" fill="none" stroke="#c62828" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr_red)"/>
  <polyline points="720,678 720,155 710,155" fill="none" stroke="#c62828" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr_red)"/>
</svg>
