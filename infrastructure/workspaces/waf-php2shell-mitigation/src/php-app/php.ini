; Server-side mitigations from the AWS Security Blog / PHP advisories
; (GHSA-w8hw-w9fx-j79w, GHSA-6wmf-4rv5-p3rp). Set here, never per request (.htaccess / PHP_VALUE).

; CVE-2026-109619 trigger: session upload progress tracking.
session.upload_progress.enabled = 0

; CVE-2026-109618 trigger: PHP's own out-of-memory bailout during request startup.
; Memory is capped by the Lambda function's memory size (cgroup) instead.
memory_limit = -1
post_max_size = 8M
; Keep below post_max_size, as the PHP advisory recommends.
upload_max_filesize = 6M

session.save_path = /tmp/sessions
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL
