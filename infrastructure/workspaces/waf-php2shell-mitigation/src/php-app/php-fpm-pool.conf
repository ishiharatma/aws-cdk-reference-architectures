; Overrides for the official image's [www] pool (loaded after www.conf / zz-docker.conf).
[www]
pm = static
; Lambda sends one request at a time to an execution environment.
pm.max_children = 1
; Recycle the worker after every request so no global state survives into the next one
; (server-side mitigation for CVE-2026-109619, recommended by the AWS Security Blog).
pm.max_requests = 1
