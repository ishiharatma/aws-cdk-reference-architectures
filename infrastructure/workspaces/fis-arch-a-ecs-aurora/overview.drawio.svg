<rect x="769" y="295" width="50" height="30" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
<text x="794" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#444">Task</text>
