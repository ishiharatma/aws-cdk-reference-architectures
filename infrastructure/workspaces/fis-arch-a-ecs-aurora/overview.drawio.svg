<polyline points="740,335 740,420 485,420 485,475" fill="none" stroke="#555555" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="20" y="390" width="310" height="310" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="1.5" stroke-dasharray="6,3"/>
<text x="30" y="408" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c62828">AWS FIS Experiments</text>
<rect x="30" y="425" width="290" height="52" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
<text x="40" y="443" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c62828">A-1: Aurora Writer→Reader Failover</text>
<text x="40" y="459" font-family="Arial,sans-serif" font-size="9" fill="#666">aws:rds:failover-db-cluster</text>
<rect x="30" y="485" width="290" height="52" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
<text x="40" y="503" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c62828">A-2: ECS All-Tasks Stop (100%)</text>
<text x="40" y="519" font-family="Arial,sans-serif" font-size="9" fill="#666">aws:ecs:stop-task</text>
<rect x="30" y="545" width="290" height="52" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
<text x="40" y="563" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c62828">A-3: ECS→DB Blackhole (egress TCP 5432 · 5 min)</text>
<text x="40" y="579" font-family="Arial,sans-serif" font-size="9" fill="#666">aws:ecs:network-blackhole-port</text>
<rect x="30" y="605" width="290" height="52" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
<text x="40" y="623" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c62828">A-4: ALB→ECS Blackhole (ingress TCP 80 · 5 min)</text>
<text x="40" y="639" font-family="Arial,sans-serif" font-size="9" fill="#666">aws:ecs:network-blackhole-port</text>
<rect x="30" y="670" width="290" height="22" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
<text x="40" y="686" font-family="Arial,sans-serif" font-size="10" fill="#e65100">Stop: ALB 5xx Alarm → auto-stops experiment</text>
<polyline points="175,390 175,460 395,460 395,475" fill="none" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr_red)"/>
<polyline points="175,390 175,300 640,300" fill="none" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr_red)"/>
</svg>