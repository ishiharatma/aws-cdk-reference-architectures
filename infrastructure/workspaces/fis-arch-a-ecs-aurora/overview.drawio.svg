  <rect width="1160" height="720" fill="#fafafa"/>
<text x="580" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">Architecture A: CloudFront + Internal ALB + ECS Fargate + Aurora PostgreSQL</text>
