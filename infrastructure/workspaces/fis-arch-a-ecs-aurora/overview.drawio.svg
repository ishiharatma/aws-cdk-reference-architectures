<text x="235" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">Amazon CloudFront</text>
<text x="235" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555555">VPC Origin + S3 fallback</text>
<text x="235" y="96" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-style="italic" fill="#888">Origin Group fallback</text>
