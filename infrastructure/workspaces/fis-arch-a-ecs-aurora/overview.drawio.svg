<text x="485" y="529" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555555">PostgreSQL 16.4 sv2 · 0.5–4 ACU</text>
<rect x="625" y="475" width="180" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<text x="715" y="507" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">Aurora Reader</text>
<text x="715" y="529" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555555">PostgreSQL 16.4 sv2 · 0.5–4 ACU</text>
