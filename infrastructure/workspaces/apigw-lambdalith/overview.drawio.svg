<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1040 440" width="1040px" height="440px" font-family="Helvetica, Arial, sans-serif" content="&lt;mxfile host=&quot;app.diagrams.net&quot; agent=&quot;aws-cdk-reference-architectures&quot;&gt;&lt;diagram id=&quot;overview&quot; name=&quot;overview&quot;&gt;&lt;mxGraphModel dx=&quot;1040&quot; dy=&quot;440&quot; grid=&quot;0&quot; page=&quot;1&quot; pageWidth=&quot;1040&quot; pageHeight=&quot;440&quot; background=&quot;#ffffff&quot;&gt;&lt;root&gt;&lt;mxCell id=&quot;0&quot;/&gt;&lt;mxCell id=&quot;1&quot; parent=&quot;0&quot;/&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6472"/>
    </marker>
  </defs>
  <style>
    .title { font-size: 19px; font-weight: 700; fill: #16191F; }
    .subtitle { font-size: 12px; fill: #5A6472; }
    .cloudTitle { font-size: 13px; font-weight: 700; fill: #232F3E; }
    .label { font-size: 12px; font-weight: 600; fill: #16191F; text-anchor: middle; }
    .sublabel { font-size: 10px; fill: #5A6472; text-anchor: middle; }
    .tileGlyph { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .edge { stroke: #5A6472; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .edgeLabel { font-size: 9.5px; fill: #40474F; text-anchor: middle; }
    .codeBox { font-size: 10px; fill: #40474F; }
  </style>
  <rect x="0" y="0" width="1040" height="440" fill="#ffffff"/>
  <text x="30" y="34" class="title">API Gateway + Lambdalith (Hono)</text>
  <text x="30" y="54" class="subtitle">One Lambda function serves every route. Routing happens in-process via the Hono framework; API Gateway is a thin {proxy+} pass-through.</text>
  <line x1="30" y1="66" x2="1010" y2="66" stroke="#ED7100" stroke-width="2.5"/>

  <rect x="30" y="84" width="980" height="330" fill="none" stroke="#232F3E" stroke-width="1.4"/>
  <text x="46" y="104" class="cloudTitle">AWS Cloud &#183; ap-northeast-1</text>

  <!-- Client -->
  <rect x="70" y="210" width="56" height="56" rx="6" fill="#232F3D"/>
  <text x="98" y="243" class="tileGlyph">HTTP</text>
  <text x="98" y="282" class="label">Client</text>
  <text x="98" y="297" class="sublabel">curl / SPA / mobile</text>

  <!-- API Gateway -->
  <rect x="250" y="210" width="56" height="56" rx="6" fill="#E7157B"/>
  <text x="278" y="243" class="tileGlyph">API</text>
  <text x="278" y="282" class="label">API Gateway</text>
  <text x="278" y="297" class="sublabel">REST API &#183; ANY /{proxy+}</text>
  <text x="278" y="311" class="sublabel">access + INFO logging</text>

  <!-- Lambdalith function -->
  <rect x="470" y="170" width="180" height="150" rx="8" fill="#FFF3E8" stroke="#ED7100" stroke-width="1.4"/>
  <rect x="486" y="196" width="46" height="46" rx="6" fill="#ED7100"/>
  <text x="509" y="224" class="tileGlyph">&#402;</text>
  <text x="560" y="214" class="label">lambdalith</text>
  <text x="560" y="228" class="sublabel">single function</text>
  <text x="486" y="266" class="codeBox">hono/aws-lambda handle(app)</text>
  <text x="486" y="282" class="codeBox">app.route('/todos', todos)</text>
  <text x="486" y="298" class="codeBox">GET POST GET PUT DELETE</text>

  <!-- DynamoDB -->
  <rect x="880" y="210" width="56" height="56" rx="6" fill="#4D72F3"/>
  <text x="908" y="243" class="tileGlyph">DDB</text>
  <text x="908" y="282" class="label">DynamoDB</text>
  <text x="908" y="297" class="sublabel">Todos table (on-demand)</text>
  <text x="908" y="311" class="sublabel">PITR + SSE</text>

  <!-- edges -->
  <path class="edge" d="M 126 238 L 245 238"/>
  <text x="185" y="231" class="edgeLabel">HTTPS</text>
  <path class="edge" d="M 306 238 L 465 240"/>
  <text x="388" y="231" class="edgeLabel">AWS_PROXY (whole API)</text>
  <path class="edge" d="M 650 240 L 875 238"/>
  <text x="762" y="231" class="edgeLabel">SDK &#183; grantReadWriteData</text>
</svg>
